name: TaskFlow Dev CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/backend/**'
      - '.github/workflows/dev-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/backend/**'
      - '.github/workflows/dev-ci.yml'

env:
  IMAGE_NAME: taskflow-backend
  REGISTRY: quay.io

jobs:
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit
      
      - name: Run Bandit SAST
        working-directory: app/backend
        run: |
          echo "Running Bandit static analysis..."
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f screen
        continue-on-error: true
      
      - name: Run pip-audit
        working-directory: app/backend
        run: |
          echo "Running pip-audit dependency scan..."
          pip-audit --desc --format json --output pip-audit-report.json || true
          pip-audit --desc
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            app/backend/bandit-report.json
            app/backend/pip-audit-report.json
          retention-days: 30

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      
      - name: Generate image tag
        id: image-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="v1.0-${SHORT_SHA}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"
      
      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.QUAY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ secrets.QUAY_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest
      
      - name: Authenticate to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} \
                   --server=${{ secrets.OPENSHIFT_SERVER }} \
                   --insecure-skip-tls-verify=true
          oc project ${{ secrets.OPENSHIFT_NAMESPACE }}
      
      - name: Deploy to OpenShift
        run: |
          echo "Deploying image: ${{ env.REGISTRY }}/${{ secrets.QUAY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}"
          
          # Update the deployment with new image
          oc set image deployment/taskflow-backend \
            backend=${{ env.REGISTRY }}/${{ secrets.QUAY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }} \
            -n ${{ secrets.OPENSHIFT_NAMESPACE }}
          
          # Wait for rollout to complete
          oc rollout status deployment/taskflow-backend \
            -n ${{ secrets.OPENSHIFT_NAMESPACE }} \
            --timeout=5m
      
      - name: Verify deployment
        run: |
          echo "Checking deployment status..."
          oc get deployment taskflow-backend -n ${{ secrets.OPENSHIFT_NAMESPACE }}
          
          echo "Checking pods..."
          oc get pods -l app=taskflow,component=backend -n ${{ secrets.OPENSHIFT_NAMESPACE }}
      
      - name: Smoke test
        run: |
          # Check if route exists before testing
          if ! oc get route taskflow-backend -n ${{ secrets.OPENSHIFT_NAMESPACE }} &>/dev/null; then
            echo "⚠️  Route 'taskflow-backend' not found. Skipping smoke test."
            echo "This is expected if the route hasn't been created yet."
            exit 0
          fi
          
          # Get the route URL
          ROUTE_URL=$(oc get route taskflow-backend -n ${{ secrets.OPENSHIFT_NAMESPACE }} -o jsonpath='{.spec.host}')
          
          if [ -z "$ROUTE_URL" ]; then
            echo "⚠️  Could not determine route URL. Skipping smoke test."
            exit 0
          fi
          
          echo "Testing application at: https://${ROUTE_URL}"
          
          # Wait for route to be ready
          sleep 10
          
          # Test health endpoint with retries
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Testing /health endpoint..."
            
            if curl -sf --max-time 10 "https://${ROUTE_URL}/health" | grep -q "healthy"; then
              echo "✅ Health check passed!"
              
              # Also test API endpoint
              if curl -sf --max-time 10 "https://${ROUTE_URL}/api" | grep -q "TaskFlow API"; then
                echo "✅ API endpoint responding correctly!"
                exit 0
              else
                echo "⚠️  API endpoint test failed, but health check passed."
                exit 0
              fi
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done
          
          echo "❌ Smoke test failed after $MAX_RETRIES attempts"
          exit 1
      
      - name: Deployment summary
        if: always()
        run: |
          echo "=== Deployment Summary ==="
          echo "Image: ${{ env.REGISTRY }}/${{ secrets.QUAY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}"
          echo "Namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"