apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: happyotter-dev
  labels:
    app: taskflow
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
      component: backend
  template:
    metadata:
      labels:
        app: taskflow
        component: backend
    spec:
      containers:
      - name: backend
        image: quay.io/happyotter/taskflow-backend:v1.0
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: taskflow-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL