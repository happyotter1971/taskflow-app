---
# defaults file for roles/taskflow-backend
backend_name: taskflow-backend
backend_namespace: happyotter-dev  # CORRECTED
backend_replicas: 2
backend_image: "{{ registry_url }}/{{ registry_username }}/taskflow-backend"
backend_tag: v1.0
backend_cpu_request: 100m
backend_memory_request: 128Mi
backend_cpu_limit: 500m
backend_memory_limit: 512Mi
backend_environment: development
db_secret_name: taskflow-db-secret
configmap_name: taskflow-config  # ADDED for consistency