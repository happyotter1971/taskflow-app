---
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  
  vars:
    app_name: taskflow
    namespace_dev: happyotter-dev  # CORRECTED: was taskflow-dev
    
    registry_url: quay.io
    registry_username: "{{ lookup('env', 'QUAY_USERNAME') }}"
    
    backend_replicas_dev: 2
    backend_image: "{{ registry_url }}/{{ registry_username }}/taskflow-backend"
    backend_tag: v1.0
    
    db_name: taskflowdb
    db_user: taskflowuser
    db_password: "{{ lookup('env', 'DB_PASSWORD') | default('taskflow123', true) }}"